# Command-center cameras. Each camera is bound to a live NVR channel
# (streams.yaml nvrs) and runs exactly ONE detection pipeline at a time. `default_mode` only seeds
# the database on first start — afterwards the database (backend/data/
# command_center.db) is the source of truth, changed at runtime through
#   PATCH /api/v1/cameras/{camera_id}/detection-mode
# Modes: none | intrusion | anpr | vehicle_counting | person_counting | anomaly
#
# Live binding: `nvr` (streams.yaml nvrs[].id) + `nvr_type` (that NVR's `type`: cpplus | hikvision —
# required, checked against streams.yaml at start-up) + `channel` (1-based NVR channel)
# + optional `subtype` (1 = sub stream, the default for tiles and AI; 0 = main
# stream for high-resolution analysis). The main stream is always available on
# demand for the focused view. Cameras without an NVR channel have no video
# source (NO FEED) — there are no recorded/mock feeds.
cameras:
- id: CAM-01
  name: ANPR CHECKPOST 1
  default_mode: none
  nvr: FILE-01
  nvr_type: file
  channel: 1
